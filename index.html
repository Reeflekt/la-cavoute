"0" value="0"></div><div class="field"><label>Stade initial</label><select id="addStage"><option>Jeunesse</option><option>Maturité</option><option>Déclin</option><option>Sénescence</option></select></div><div class="field full"><label>Notes personnelles</label><textarea id="addNotes" placeholder="Notes de dégustation, occasion, remarques…"></textarea></div></div><button class="primary" type="submit">Ajouter et placer automatiquement</button></form></div></aside></div>`)}
function setAddFields(d){Object.entries(d).forEach(([k,v])=>{const e=$('#add'+k);if(e)e.value=v})}
function simulateScan(type){if(type==='label')setAddFields({Domain:'Château Gloria',Name:'Saint-Julien',Year:2020,Family:'Rouges',Region:'Bordeaux',Appellation:'Saint-Julien',Grapes:'Cabernet Sauvignon, Merlot'});else setAddFields({Barcode:'3760123456789',Domain:'Domaine exemple',Name:'Cuvée Réserve',Year:2021,Family:'Rouges'});toast('Informations détectées : vérifie puis complète la fiche.')}
function simulateLookup(){const q=$('#onlineQuery').value.trim();if(!q){toast('Saisis un nom, un domaine ou un millésime.');return}setAddFields({Domain:'Château Gloria',Name:'Saint-Julien',Year:2020,Family:'Rouges',Region:'Bordeaux',Appellation:'Saint-Julien',Grapes:'Cabernet Sauvignon, Merlot',ValueLow:38,ValueMid:45,ValueHigh:55});$('#lookupResult').innerHTML='<div class="lookup-result">Résultat trouvé et fiche préremplie. Les données Internet devront toujours être validées avant l’enregistrement.</div>'}
function saveWine(e){e.preventDefault();const id=nextWineId(),qty=Math.max(1,Math.min(999,Math.round(+$('#addQty').value)||1)),family=$('#addFamily').value,stage=$('#addStage').value;const urg={Jeunesse:25,'Maturité':60,'Déclin':92,'Sénescence':99}[stage]??25;const ws=cleanOptInt($('#addWindowStart').value,1800,2200),we=cleanOptInt($('#addWindowEnd').value,1800,2200);const w=normalizeWine({id,qty,family,format:+$('#addFormat').value||75,style:$('#addStyle').value,region:$('#addRegion').value,domain:$('#addDomain').value,name:$('#addName').value,year:+$('#addYear').value,nm:!!$('#addNM').checked,stage,drink:urg>=92?'À boire sans attendre':urg>=75?'À boire':urg>=45?'Accessible, peut attendre':'À attendre',urgency:urg,peak:false,appellation:$('#addAppellation').value,grapes:$('#addGrapes').value,barcode:$('#addBarcode').value,purchasePrice:$('#addPurchasePrice').value,valueLow:+$('#addValueLow').value||0,valueMid:+$('#addValueMid').value||0,valueHigh:+$('#addValueHigh').value||0,notes:$('#addNotes').value,windowStart:ws,windowEnd:we,windowOrigin:ws&&we?'Saisie manuelle':'',window:ws&&we?ws+'–'+we:''});if(w&&w.windowStart&&w.windowEnd&&w.windowEnd>w.windowStart){Object.assign(w,computeMaturity(w))}if(!w){toast('Données invalides : vérifiez le domaine ou la cuvée.');return}wines.push(w);for(let i=0;i<qty;i++)bottles.push({...w,uid:id+'-'+i});invalidateCache();saveWines();ensurePositions();state.family=family;closeWine();render();const missing=activeBottles().filter(b=>b.id===id&&!bottlePositions[b.uid]).length;toast(missing?`${qty} bouteille(s) ajoutée(s), dont ${missing} sans emplacement : agrandissez un rack ou créez-en un.`:`${qty} bouteille(s) ajoutée(s) et placée(s) automatiquement.`,missing?4500:2300)}
function showStatsList(type,title,val=''){
 let list=activeBottles();
 if(type==='drink')list=list.filter(w=>w.urgency>=settings.threshDrink);
 if(type==='watch')list=list.filter(w=>w.urgency>=settings.threshWatch&&w.urgency<settings.threshDrink);
 if(type==='keep')list=list.filter(w=>w.urgency<settings.threshWatch);
 if(type==='stage')list=list.filter(w=>w.stage===val);
 if(type==='peak')list=list.filter(w=>w.peak);
 if(type==='family')list=list.filter(w=>w.family===val);
 if(type==='magnum')list=list.filter(w=>w.format===150);
 if(type==='nm')list=list.filter(w=>w.nm);
 if(type==='region')list=list.filter(w=>(w.region||'Non renseignée')===val);
 openModal(`<div class="overlay" onclick="closeWine()"><aside class="sheet" onclick="event.stopPropagation()"><div class="sheet-head"><span class="muted">Statistiques détaillées</span><button class="close" onclick="closeWine()">✕</button></div><div class="sheet-body"><div class="stat-list-head"><div><div class="eyebrow">SÉLECTION</div><h2 style="margin:5px 0">${esc(title)}</h2><div class="muted">${list.length} bouteille(s) concernée(s)</div></div></div><div class="stat-list">${list.length?list.map(w=>`<button class="stat-wine" onclick="openWine('${w.uid}')"><span class="stat-wine-icon">${icon(w,'front')}</span><span><span class="stat-wine-name">${esc(w.name||w.domain)}</span><span class="stat-wine-domain">${esc(w.domain)}</span><span class="stat-wine-meta">${esc(yearLabel(w))} · ${w.family}${w.format&&w.format!==75?' · '+esc(formatBadge(w)):''}</span></span><span class="stat-wine-status" style="color:${STAGE_COLORS[w.stage]||urgency(w)}">${esc(w.stage)}</span></button>`).join(''):'<div class="valuation-note">Aucune bouteille dans cette catégorie.</div>'}</div></div></aside></div>`)
}
function removeBottleFromCellar(uid,action){const b=bottleByUid(uid);if(!b||inactiveIds().has(uid))return;const slot=slotLabel(b.uid),pos=bottlePositions[b.uid]?{...bottlePositions[b.uid]}:null;const label=action==='Bue'?'Confirmer que cette bouteille a été bue ?':'Confirmer le retrait de cette bouteille sans la marquer comme bue ?';if(!confirm(label))return;bottleHistory.push({uid:b.uid,id:b.id,name:b.name||b.domain,domain:b.domain,year:yearLabel(b),family:b.family,action,date:new Date().toISOString(),slot:slot||'',pos});invalidateCache();saveBottleHistory();delete bottlePositions[b.uid];savePositions();closeWine();render();toast(action==='Bue'?'Bouteille bue : la case est libérée.':'Bouteille retirée : la case est libérée.')}
function priceCardMarkup(w){const hasVal=w.valueLow>0||w.valueMid>0||w.valueHigh>0,hasBuy=w.purchasePrice!==null&&w.purchasePrice!==undefined;if(!hasVal&&!hasBuy)return'';return `<div class="info" style="margin-top:9px"><h4>Tarif & valorisation</h4>${hasVal?`<div class="price-strip"><div class="price-box"><small>Basse</small><strong>${w.valueLow?money(w.valueLow):'—'}</strong></div><div class="price-box"><small>Moyenne</small><strong>${w.valueMid?money(w.valueMid):'—'}</strong></div><div class="price-box"><small>Haute</small><strong>${w.valueHigh?money(w.valueHigh):'—'}</strong></div></div>`:''}${hasBuy?`<div class="price-purchase">Prix d’achat : ${money(w.purchasePrice)} / bt.</div>`:''}</div>`}

let winEditOpen=false;
function timelineInnerMarkup(w,cfg=settings){
 const ws=w.windowStart,we=w.windowEnd,ry=activeRefYear(cfg),m=computeMaturity(w,cfg);
 if(ws===null||ws===undefined||we===null||we===undefined||we<=ws){
  return `<div class="muted">Fenêtre de dégustation non définie. Touchez « Ajuster » pour renseigner les années de début et de fin.</div>`;
 }
 const span=we-ws;
 const declinYr=ws+span*(cfg.declinStart/100);
 const senesYr=ws+span*(cfg.senescenceStart/100);
 const pLoYr=(w.peakStart!==null&&w.peakStart!==undefined)?Math.max(ws,Math.min(we,w.peakStart)):ws+span*(cfg.peakStart/100);
 const pHiYr=(w.peakEnd!==null&&w.peakEnd!==undefined)?Math.max(pLoYr,Math.min(we,w.peakEnd)):ws+span*(cfg.peakEnd/100);
 const baseYr=w.year&&w.year<ws?w.year:ws-2;
 const tMin=Math.min(baseYr,ws-1,ry-1);
 const tMax=Math.max(senesYr+Math.max(2,Math.round(span*0.25)),ry+1);
 const totalSpan=Math.max(1,tMax-tMin);
 const pct=y=>Math.max(0,Math.min(100,(y-tMin)/totalSpan*100));
 const xWs=pct(ws),xPLo=pct(pLoYr),xPHi=pct(pHiYr),xDec=pct(declinYr),xSen=pct(senesYr),xCur=pct(ry);
 const posPct=m.pos!==null?Math.round(m.pos*100):null;
 const posTxt=posPct===null?'':posPct<0?(ws-ry)+' an(s) avant fenêtre':posPct+' % de la fenêtre';
 const tickCls=x=>x<8?' left':x>92?' right':'';
 const ticks=[{x:0,l:String(Math.round(tMin))},{x:xWs,l:String(ws)},{x:pct(we),l:String(we)}];
 if(Math.abs(xSen-pct(we))>10&&xSen<93)ticks.push({x:xSen,l:String(Math.round(senesYr))});
 const dedupTicks=[];ticks.forEach(t=>{if(!dedupTicks.some(o=>Math.abs(o.x-t.x)<11))dedupTicks.push(t)});
 return `<div class="tl-status-row"><span class="tl-pill st-${esc(m.stage)}">${esc(m.stage)}</span>${m.peak?'<span class="tl-pill pk">★ Apogée</span>':''}<span class="tl-meta-right">Urgence <b style="color:${urgency(m)}">${m.urgency}</b> · ${esc(posTxt)}</span></div>`+
  `<div class="muted" style="margin:-8px 0 8px;font-size:12px"><b style="color:${urgency(m)}">${esc(m.drink)}</b> · Fenêtre ${ws}–${we}${w.peakStart&&w.peakEnd?' · Apogée propre '+w.peakStart+'–'+w.peakEnd:''}</div>`+
  `<div class="tl-wrap">`+
   `<div class="tl-cursor" style="left:${xCur.toFixed(2)}%"><span class="tl-cursor-tag">${ry}${isSimulatedYear(cfg)?' 🔮':''}</span><span class="tl-cursor-dot"></span></div>`+
   `<div class="tl-track">`+
    `<div class="tl-seg s-j" style="left:0%;width:${xWs.toFixed(2)}%"></div>`+
    `<div class="tl-seg s-m" style="left:${xWs.toFixed(2)}%;width:${Math.max(0,xDec-xWs).toFixed(2)}%"></div>`+
    `<div class="tl-seg s-p" style="left:${xPLo.toFixed(2)}%;width:${Math.max(0,xPHi-xPLo).toFixed(2)}%"></div>`+
    `<div class="tl-seg s-d" style="left:${xDec.toFixed(2)}%;width:${Math.max(0,xSen-xDec).toFixed(2)}%"></div>`+
    `<div class="tl-seg s-s" style="left:${xSen.toFixed(2)}%;width:${Math.max(0,100-xSen).toFixed(2)}%"></div>`+
    `<div class="tl-div" style="left:${xWs.toFixed(2)}%"></div>`+
    `<div class="tl-div" style="left:${xDec.toFixed(2)}%"></div>`+
    `<div class="tl-div" style="left:${xSen.toFixed(2)}%"></div>`+
   `</div>`+
   `<div class="tl-ticks">${dedupTicks.map(t=>`<span class="tl-tick${tickCls(t.x)}" style="left:${t.x.toFixed(2)}%">${t.l}</span>`).join('')}</div>`+
  `</div>`+
  `<div class="tl-legend"><span><i style="background:#a855f7"></i>Jeunesse</span><span><i style="background:#38bdf8"></i>Maturité</span><span><i class="pk"></i>Apogée</span><span><i style="background:#facc15"></i>Déclin</span><span><i style="background:#ef4444"></i>Sénescence</span></div>`;
}
function timelineCardMarkup(w){
 return `<div class="tl-card" id="tlCard"><div class="tl-head"><h4>Frise de maturité (${activeRefYear()})</h4><button class="tl-edit-btn" onclick="toggleWinEditor()">${winEditOpen?'Fermer':'✎ Ajuster la fenêtre'}</button></div><div id="tlLive">${timelineInnerMarkup(w)}</div><div id="tlEditor" class="tl-editor${winEditOpen?'':' hidden'}"><div class="form-grid"><div class="field"><label>Début fenêtre</label><input id="edWinStart" type="number" min="1950" max="2150" value="${w.windowStart??''}" oninput="previewWineWindow()"></div><div class="field"><label>Fin fenêtre</label><input id="edWinEnd" type="number" min="1950" max="2150" value="${w.windowEnd??''}" oninput="previewWineWindow()"></div><div class="field"><label>Apogée début (opt.)</label><input id="edPeakStart" type="number" min="1950" max="2150" placeholder="Auto (${settings.peakStart}%)" value="${w.peakStart??''}" oninput="previewWineWindow()"></div><div class="field"><label>Apogée fin (opt.)</label><input id="edPeakEnd" type="number" min="1950" max="2150" placeholder="Auto (${settings.peakEnd}%)" value="${w.peakEnd??''}" oninput="previewWineWindow()"></div></div><div class="tl-editor-actions"><button class="primary" onclick="saveWineWindow()">Enregistrer</button><button class="secondary" onclick="toggleWinEditor(false)">Annuler</button></div></div></div>`;

function toggleWinEditor(force){
 winEditOpen=(typeof force==='boolean')?force:!winEditOpen;
 const ed=$('#tlEditor'),btn=document.querySelector('.tl-edit-btn');
 if(ed)ed.classList.toggle('hidden',!winEditOpen);
 if(btn)btn.textContent=winEditOpen?'Fermer':'✎ Ajuster la fenêtre';
 if(!winEditOpen){const b=bottleByUid(sheetUid);if(b&&$('#tlLive'))$('#tlLive').innerHTML=timelineInnerMarkup(b)}
}
function previewWineWindow(){

 const ws=cleanOptInt($('#edWinStart').value,1800,2200),we=cleanOptInt($('#edWinEnd').value,1800,2200);

function saveWineWindow(){
 const b=bottleByUid(sheetUid);if(!b)return;
 const ws=cleanOptInt($('#edWinStart').value,1800,2200),we=cleanOptInt($('#edWinEnd').value,1800,2200);
 const ps=cleanOptInt($('#edPeakStart').value,1800,2200),pe=cleanOptInt($('#edPeakEnd').value,1800,2200);
 if(ws===null||we===null||we<=ws){toast('Indiquez une fenêtre valide (fin strictement supérieure au début).',3500);return}
 if((ps!==null)!==(pe!==null)){toast('Renseignez à la fois le début et la fin d’apogée propre, ou laissez les deux vides.',4000);return}
 if(ps!==null&&pe!==null&&(pe<=ps||ps<ws||pe>we)){toast('L’apogée propre doit être comprise dans la fenêtre (début < fin).',4000);return}
 const w=wines.find(x=>x.id===b.id);if(!w)return;
 w.windowStart=ws;w.windowEnd=we;w.window=ws+'–'+we;w.windowOrigin='Personnalisée';w.peakStart=ps;w.peakEnd=pe;
 const m=computeMaturity(w);w.stage=m.stage;w.drink=m.drink;w.urgency=m.urgency;w.peak=m.peak;
 bottles.forEach(x=>{if(x.id===w.id){x.windowStart=ws;x.windowEnd=we;x.window=w.window;x.windowOrigin=w.windowOrigin;x.peakStart=ps;x.peakEnd=pe;x.stage=m.stage;x.drink=m.drink;x.urgency=m.urgency;x.peak=m.peak}});
 invalidateCache();saveWines();winEditOpen=false;render();openWine(sheetUid);toast('Fenêtre de dégustation mise à jour ('+w.window+').');
}
let draftSet=null;
function openSettings(){
 draftSet={...settings};
 renderSettingsModal();
}
function settingsPreviewStats(cfg){
 const live=activeBottles();
 let drink=0,peak=0,declin=0,senes=0;
 live.forEach(b=>{const m=computeMaturity(b,cfg);if(m.urgency>=cfg.threshDrink)drink++;if(m.peak)peak++;if(m.stage==='Déclin')declin++;if(m.stage==='Sénescence')senes++});
 return{drink,peak,declin,senes};
}

"95" value="${c.peakEnd}" oninput="updateDraftNumbers()"></div><div class="field"><label>Début Déclin (%)</label><input id="setDeclin" type="number" min="50" max="115" value="${c.declinStart}" oninput="updateDraftNumbers()"></div><div class="field"><label>Début Sénescence (%)</label><input id="setSenes" type="number" min="80" max="200" value="${c.senescenceStart}" oninput="updateDraftNumbers()"></div></div><h3 style="margin:14px 0 8px">Urgence et catégories</h3><div class="form-grid"><div class="field"><label>Urgence début fenêtre</label><input id="setUrgBase" type="number" min="0" max="90" value="${c.urgBase}" oninput="updateDraftNumbers()"></div><div class="field"><label>Pente d’urgence</label><input id="setUrgSlope" type="number" min="1" max="100" value="${c.urgSlope}" oninput="updateDraftNumbers()"></div><div class="field"><label>Max avant fenêtre</label><input id="setUrgPreMax" type="number" min="0" max="60" value="${c.urgPreMax}" oninput="updateDraftNumbers()"></div><div class="field"><label>Baisse / an d’avance</label><input id="setUrgPreStep" type="number" min="1" max="30" value="${c.urgPreStep}" oninput="updateDraftNumbers()"></div><div class="field"><label>Plancher avant fenêtre</label><input id="setUrgPreMin" type="number" min="0" max="30" value="${c.urgPreMin}" oninput="updateDraftNumbers()"></div><div class="field"><label>Urgence si dépassée</label><input id="setUrgOver" type="number" min="80" max="100" value="${c.urgOver}" oninput="updateDraftNumbers()"></div><div class="field"><label>Seuil « À boire » (≥)</label><input id="setThDrink" type="number" min="50" max="99" value="${c.threshDrink}" oninput="updateDraftNumbers()"></div><div class="field"><label>Seuil « À surveiller » (≥)</label><input id="setThWatch" type="number" min="10" max="80" value="${c.threshWatch}" oninput="updateDraftNumbers()"></div></div><div class="data-actions"><button class="primary" onclick="applySettings()">Enregistrer les paramètres</button><button class="secondary" onclick="resetDefaultSettings()">Réinitialiser (valeurs Excel)</button></div></div></aside></div>`);

let editWineId=0,editMode='edit';
function openDuplicateWine(wineId){openEditWine(wineId,'dup')}
function openEditWine(wineId,mode='edit'){
 const w=wines.find(x=>x.id===wineId);if(!w)return;
 editWineId=wineId;editMode=mode;
 const isDup=(mode==='dup'),qtyAct=activeQty(w.id);
 const fOpts=Object.keys(families).map(f=>`<option value="${f}" ${w.family===f?'selected':''}>${f}</option>`).join('');
 const pbOpts=['','Cuvée','Type d’appellation'].map(v=>`<option value="${v}" ${w.palateBasis===v?'selected':''}>${v||'— Non précisée'}</option>`).join('');
 const relOpts=['','Bonne','Moyenne','Faible'].map(v=>`<option value="${v}" ${w.reliability===v?'selected':''}>${v||'— Non précisée'}</option>`).join('');
 const fmtVal=w.format||75,knownFmts=[37.5,75,150];
 const notice=isDup
  ?`<div class="edit-multi-note">⧉ <b>Nouvelle fiche préremplie</b> d’après « ${esc(w.name||w.domain)} ». Modifiez le millésime, la cuvée ou la fenêtre : la fiche d’origine ne sera pas modifiée.</div>`
  :(qtyAct>1?`<div class="edit-multi-note">ℹ Cette modification s’applique aux <b>${qtyAct} bouteilles</b> de cette référence. Pour ajouter un autre millésime sans modifier celles-ci, utilisez <button type="button" class="filter-reset" onclick="openDuplicateWine(${w.id})">⧉ Dupliquer</button>.</div>`:'');
 openModal(`<div class="overlay" onclick="closeWine()"><aside class="sheet" onclick="event.stopPropagation()"><div class="sheet-head"><b>${isDup?'Dupliquer en nouvelle fiche':'Modifier la fiche'}</b><div class="sheet-head-actions"><button class="close" onclick="openWine(sheetUid||nextActiveUid(${w.id}))">✕</button></div></div><div class="sheet-body"><div class="eyebrow">${isDup?'NOUVELLE VARIANTE / MILLÉSIME':'ÉDITION COMPLÈTE'}</div><h2 style="margin:5px 0 8px">${esc(w.name||w.domain)}</h2>${notice}<form id="editWineForm" onsubmit="saveEditedWine(event)"><div class="form-grid"><div class="field"><label>Domaine / Producteur</label><input id="edDomain" value="${esc(w.domain)}" placeholder="Domaine ou château"></div><div class="field"><label>Cuvée / Vin</label><input id="edName" value="${esc(w.name)}" placeholder="Nom de la cuvée"></div><div class="field"><label>Millésime (ou repère NM)</label><input id="edYear" type="number" min="1800" max="2100" value="${w.year||''}" required></div>${isDup?'<div class="field"><label>Quantité à ajouter</label><input id="edQty" type="number" min="1" max="999" value="1" required></div>':''}<div class="field"><label>Famille</label><select id="edFamily">${fOpts}</select></div><div class="field"><label>Format (cl)</label><select id="edFormat"><option value="75" ${fmtVal===75?'selected':''}>75 cl (standard)</option><option value="150" ${fmtVal===150?'selected':''}>150 cl (Magnum)</option><option value="37.5" ${fmtVal===37.5?'selected':''}>37,5 cl (demi)</option>${!knownFmts.includes(fmtVal)?`<option value="${fmtVal}" selected>${fmtVal} cl</option>`:''}</select></div><div class="field"><label>Style</label><input id="edStyle" value="${esc(w.style)}" placeholder="Rouge sec, Blanc sec…"></div><div class="field full"><label class="check-field"><input id="edNM" type="checkbox" ${w.nm?'checked':''}><span>Non millésimé (NM)</span></label></div><div class="field"><label>Région</label><input id="edRegion" value="${esc(w.region)}" placeholder="Bourgogne, Bordeaux…"></div><div class="field"><label>Appellation</label><input id="edAppellation" value="${esc(w.appellation)}" placeholder="Appellation"></div><div class="field full"><label>Cépages</label><input id="edGrapes" value="${esc(w.grapes)}" placeholder="Cépage ou assemblage"></div></div><div class="edit-section-title">Fenêtre & apogée</div><div class="form-grid"><div class="field"><label>Début fenêtre</label><input id="edWStart" type="number" min="1800" max="2200" value="${w.windowStart??''}" placeholder="Ex. 2025"></div><div class="field"><label>Fin fenêtre</label><input id="edWEnd" type="number" min="1800" max="2200" value="${w.windowEnd??''}" placeholder="Ex. 2032"></div><div class="field"><label>Apogée début (opt.)</label><input id="edPStart" type="number" min="1800" max="2200" value="${w.peakStart??''}" placeholder="Auto"></div><div class="field"><label>Apogée fin (opt.)</label><input id="edPEnd" type="number" min="1800" max="2200" value="${w.peakEnd??''}" placeholder="Auto"></div></div><div class="edit-section-title">Tarif, EAN & notes</div><div class="form-grid"><div class="field"><label>Prix d’achat (€/bt)</label><input id="edPurchase" type="number" min="0" step="0.01" value="${w.purchasePrice??''}" placeholder="Optionnel"></div><div class="field"><label>Code-barres (EAN)</label><input id="edBarcode" inputmode="numeric" value="${esc(w.barcode)}" placeholder="EAN"></div><div class="field"><label>Valeur basse (€)</label><input id="edVLow" type="number" min="0" step="0.5" value="${w.valueLow||0}"></div><div class="field"><label>Valeur moyenne (€)</label><input id="edVMid" type="number" min="0" step="0.5" value="${w.valueMid||0}"></div><div class="field"><label>Valeur haute (€)</label><input id="edVHigh" type="number" min="0" step="0.5" value="${w.valueHigh||0}"></div><div class="field"><label>Service</label><input id="edServing" value="${esc(w.serving)}" placeholder="16–18 °C"></div><div class="field full"><label>Notes personnelles</label><textarea id="edNotes" placeholder="Notes de dégustation, occasion, remarques…">${esc(w.notes)}</textarea></div></div><div class="edit-section-title">Textes de la fiche</div><div class="form-grid"><div class="field full"><label>Histoire du domaine</label><textarea id="edStory">${esc(w.story)}</textarea></div><div class="field full"><label>Terroir et exposition</label><textarea id="edTerroir">${esc(w.terroir)}</textarea></div><div class="field full"><label>Lecture du millésime</label><textarea id="edVintage">${esc(w.vintage)}</textarea></div><div class="field"><label>Base du profil aromatique</label><select id="edPalateBasis">${pbOpts}</select></div><div class="field"><label>Fiabilité</label><select id="edReliability">${relOpts}</select></div><div class="field full"><label>Profil aromatique</label><textarea id="edPalate">${esc(w.palate)}</textarea></div><div class="field full"><label>Évolution avec l’âge</label><textarea id="edEvolution">${esc(w.evolution)}</textarea></div><div class="field full"><label>Potentiel de garde</label><textarea id="edAging">${esc(w.aging)}</textarea></div><div class="field full"><label>Accords suggérés</label><textarea id="edPairing">${esc(w.pairing)}</textarea></div><div class="field full"><label>Sources et recherches</label><textarea id="edSources">${esc(w.sources)}</textarea></div></div><div class="consume-actions"><button class="consume-btn" type="submit">${isDup?'✓ Créer et placer':'✓ Enregistrer'}</button><button class="secondary" type="button" onclick="openWine(sheetUid||nextActiveUid(${w.id}))">Annuler</button></div></form></div></aside></div>`);
}
function saveEditedWine(e){
 e.preventDefault();
 const w=wines.find(x=>x.id===editWineId);if(!w)return;
 const isDup=(editMode==='dup');
 const domain=cleanTxt($('#edDomain').value,'',200),name=cleanTxt($('#edName').value,'',200);
 if(!domain&&!name){toast('Indiquez au moins un domaine ou une cuvée.');return}
 const ws=cleanOptInt($('#edWStart').value,1800,2200),we=cleanOptInt($('#edWEnd').value,1800,2200);
 if((ws!==null||we!==null)&&(ws===null||we===null||we<=ws)){toast('Fenêtre invalide : la fin doit être strictement supérieure au début.',3800);return}
 const ps=cleanOptInt($('#edPStart').value,1800,2200),pe=cleanOptInt($('#edPEnd').value,1800,2200);
 if((ps!==null)!==(pe!==null)){toast('Renseignez début et fin d’apogée propre, ou laissez les deux vides.',3800);return}
 if(ps!==null&&pe!==null&&(ws===null||pe<=ps||ps<ws||pe>we)){toast('L’apogée propre doit être comprise dans la fenêtre.',3800);return}
 const winChanged=(ws!==w.windowStart||we!==w.windowEnd);
 const qtyNew=isDup?Math.max(1,Math.min(999,Math.round(+$('#edQty').value)||1)):w.qty;
 const targetId=isDup?nextWineId():w.id;
 const updated=normalizeWine({...w,id:targetId,qty:qtyNew,domain,name,year:Math.round(cleanNum($('#edYear').value,w.year,1800,2100)),family:$('#edFamily').value,format:+$('#edFormat').value||75,style:$('#edStyle').value,nm:!!$('#edNM').checked,region:$('#edRegion').value,appellation:$('#edAppellation').value,grapes:$('#edGrapes').value,windowStart:ws,windowEnd:we,window:ws&&we?ws+'–'+we:'',windowOrigin:winChanged?'Personnalisée':w.windowOrigin,peakStart:ps,peakEnd:pe,purchasePrice:$('#edPurchase').value,barcode:$('#edBarcode').value,valueLow:+$('#edVLow').value||0,valueMid:+$('#edVMid').value||0,valueHigh:+$('#edVHigh').value||0,serving:$('#edServing').value,notes:$('#edNotes').value,story:$('#edStory').value,terroir:$('#edTerroir').value,vintage:$('#edVintage').value,palateBasis:$('#edPalateBasis').value,reliability:$('#edReliability').value,palate:$('#edPalate').value,evolution:$('#edEvolution').value,aging:$('#edAging').value,pairing:$('#edPairing').value,sources:$('#edSources').value});
 if(!updated){toast('Données invalides.');return}
 if(updated.windowStart&&updated.windowEnd&&updated.windowEnd>updated.windowStart)Object.assign(updated,computeMaturity(updated));
 if(isDup){
  wines.push(updated);
  const newUids=[];
  for(let i=0;i<updated.qty;i++){const uid=updated.id+'-'+i;bottles.push({...updated,uid});newUids.push(uid)}
  invalidateCache();saveWines();ensurePositions();
  const missing=newUids.filter(u=>!bottlePositions[u]).length;
  render();openWine(newUids[0]);
  toast(missing?`Nouvelle fiche créée (${updated.qty} bt., dont ${missing} sans emplacement libre).`:`Nouvelle fiche créée et placée (${updated.qty} bt.) sans modifier l’originale.`,missing?4500:3500);
  return;
 }
 Object.assign(w,updated);
 bottles.forEach(b=>{if(b.id===w.id){const uid=b.uid;Object.assign(b,w);b.uid=uid}});
 invalidateCache();saveWines();render();
 const targetUid=sheetUid||nextActiveUid(w.id);
 if(targetUid)openWine(targetUid);else closeWine();
 toast('Fiche mise à jour.');
}

function openWine(uid){winEditOpen=false;const b=bottleByUid(uid);const w=(b&&!inactiveIds().has(uid))?b:activeWines().find(x=>String(x.id)===String(uid).split('-')[0]);if(!w)return;if(state.sel||state.peek){state.sel=null;state.peek=null;hideTip();markSel()}const slot=slotLabel(w.uid),fb=formatBadge(w),winTxt=windowLabel(w),eyebrow=[w.family,w.region,w.appellation].filter(Boolean).join(' · '),peakTxt=w.peakStart&&w.peakEnd?'Apogée propre : '+w.peakStart+'–'+w.peakEnd:'';const sections=[['Histoire du domaine et identité',w.story,''],['Cépages et assemblage',w.grapes,''],['Terroir et exposition',w.terroir,''],[w.nm?'Lecture du millésime (repère '+yearLabel(w)+')':'Lecture du millésime '+yearLabel(w),w.vintage,''],['Profil aromatique',w.palate,w.palateBasis||''],['Évolution actuelle et future',w.evolution,''],['Potentiel de garde',w.aging,''],['Service',w.serving,''],['Accords suggérés',w.pairing,''],['Notes personnelles',w.notes,''],['Code-barres (EAN)',w.barcode,''],['Fiabilité des données',w.reliability,''],['Sources et recherches',w.sources,'']].filter(x=>x[1]);openModal(`<div class="overlay" onclick="closeWine()"><aside class="sheet" onclick="event.stopPropagation()"><div class="sheet-head"><span class="muted">Fiche détaillée</span><div class="sheet-head-actions"><button class="edit-btn" onclick="openEditWine(${w.id})">✎ Modifier</button><button class="close" onclick="closeWine()">✕</button></div></div><div class="sheet-body"><div class="hero"><div class="photo">${icon(w,'front')}<button class="photo-btn" onclick="toast('Ajout de photo disponible dans la future APK')">📷 Ma photo</button>${w.peak?'<span class="ribbon">APOGÉE</span>':''}</div><div><div class="eyebrow">${esc(eyebrow)}</div><h2>${esc(w.name||w.domain)}</h2><div class="hero-meta"><p class="hero-domain">${esc(w.domain)}</p><span class="hero-year">${esc(yearLabel(w))}</span></div><div class="badges"><span class="badge" style="color:${STAGE_COLORS[w.stage]||'white'}">${esc(w.stage)}</span><span class="badge" style="color:${urgency(w)}">${esc(w.drink)}</span>${fb?`<span class="badge magnum">${esc(fb)}</span>`:''}${w.nm?'<span class="badge nm">NM</span>':''}${w.style?`<span class="badge">${esc(w.style)}</span>`:''}</div></div></div><div class="info-grid"><div class="info"><h4>Emplacement</h4><p>${esc(slot)||'Non placée'}</p>${slot?`<button class="chip locate-btn" onclick="locateBottle('${w.uid}')">📍 Localiser</button>`:''}</div><div class="info"><h4>Fenêtre</h4><p>${esc(winTxt)||'—'}</p>${w.windowOrigin?`<div class="muted" style="margin-top:4px;font-size:11px">Origine : ${esc(w.windowOrigin)}</div>`:''}${peakTxt?`<div class="muted" style="margin-top:3px;font-size:11px">${esc(peakTxt)}</div>`:''}</div></div>${timelineCardMarkup(w)}${priceCardMarkup(w)}${copiesMarkup(w)}${moveFormMarkup(w)}${sections.length?`<div class="info-stack">${sections.map(x=>`<div class="info"><h4>${esc(x[0])}${x[2]?`<span class="badge basis">${esc(x[2])}</span>`:''}</h4><p>${esc(x[1])}</p></div>`).join('')}</div>`:''}<div class="consume-actions"><button class="consume-btn" onclick="removeBottleFromCellar('${w.uid}','Bue')">✓ J’ai bu cette bouteille</button><button class="remove-btn" onclick="removeBottleFromCellar('${w.uid}','Retirée')">Retirer sans la marquer comme bue</button></div></div></aside></div>`);initMoveForm(w.uid)}
let modalOpen=false,modalPushed=false,ignoreNextPop=false,swp=null;
function openModal(markup){const wasOpen=modalOpen;$('#modal').innerHTML=markup;modalOpen=true;if(!wasOpen&&!modalPushed){try{history.pushState({lcModal:true},'');modalPushed=true}catch(e){}}bindSheetSwipe()}
function closeWine(fromPop=false){if(!modalOpen&&!$('#modal').innerHTML)return;$('#modal').innerHTML='';modalOpen=false;swp=null;if(fromPop){modalPushed=false;return}if(modalPushed){modalPushed=false;ignoreNextPop=true;try{history.back()}catch(e){ignoreNextPop=false}}}
function bindSheetSwipe(){const sh=$('#modal .sheet');if(!sh)return;sh.addEventListener('touchstart',e=>{if(e.touches.length!==1)return;const tag=(e.target&&e.target.tagName||'').toUpperCase();if(tag==='INPUT'||tag==='SELECT'||tag==='TEXTAREA')return;swp={x0:e.touches[0].clientX,y0:e.touches[0].clientY,dx:0,active:false}},{passive:true});sh.addEventListener('touchmove',e=>{if(!swp||e.touches.length!==1)return;const dx=e.touches[0].clientX-swp.x0,dy=e.touches[0].clientY-swp.y0;if(!swp.active){if(Math.abs(dy)>14&&Math.abs(dy)>=Math.abs(dx)){swp=null;return}if(dx<-18&&Math.abs(dx)>Math.abs(dy)*1.3){swp.active=true;sh.classList.add('swiping')}}if(swp.active){swp.dx=Math.min(0,dx);sh.style.transform='translateX('+swp.dx+'px)';if(e.cancelable)e.preventDefault()}},{passive:false});sh.addEventListener('touchend',()=>{if(!swp)return;const s=swp;swp=null;sh.classList.remove('swiping');if(s.active&&s.dx<-65){sh.style.transform='translateX(-100%)';setTimeout(()=>closeWine(),140)}else{sh.style.transform=''}},{passive:true});sh.addEventListener('touchcancel',()=>{swp=null;sh.classList.remove('swiping');sh.style.transform=''},{passive:true})}
window.addEventListener('popstate',()=>{if(ignoreNextPop){ignoreNextPop=false;return}if(modalOpen)closeWine(true)});
if('serviceWorker' in navigator){const hadController=!!navigator.serviceWorker.controller;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(hadController)toast('Nouvelle version installée : fermez puis rouvrez l’application pour l’utiliser.',6000)});window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
ensurePositions();
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state.valueOpen){state.valueOpen=false;if(state.tab==='Dashboard')renderDashboard()}});
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{})}catch(e){}
window.addEventListener('pointerdown',onDown);window.addEventListener('pointermove',onMove);window.addEventListener('pointerup',onUp);window.addEventListener('pointercancel',onCancel);
document.addEventListener('touchmove',e=>{if(g&&(g.armed||g.drag)&&e.cancelable)e.preventDefault()},{passive:false});
document.addEventListener('touchend',e=>{if(suppressClick){suppressClick=false;if(e.cancelable)e.preventDefault()}},{passive:false});
document.addEventListener('contextmenu',e=>{if(e.target&&e.target.closest&&e.target.closest('.slot'))e.preventDefault()});
document.addEventListener('scroll',schedTip,true);window.addEventListener('resize',schedTip);
{const v=$('#view');if(v&&v.addEventListener)v.addEventListener('click',e=>{if(e.detail===0){const si=slotInfo(e.target);if(si&&state.tab==='Cave')tapSlot(si)}})}
render();
</script>
