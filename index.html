const bottles=wines.flatMap(w=>Array.from({length:w.qty},(_,i)=>({...w,uid:w.id+'-'+i})));const $=s=>document.querySelector(s);const urgency=w=>w.urgency>=92?'#ef4444':w.urgency>=75?'#f97316':w.urgency>=45?'#eab308':'#60a5fa';
function icon(w,view='front'){const c=families[w.family].color;if(view==='top'||view==='bottom')return `<div class="round-icon ${view}"><span style="background:${view==='top'?c:`radial-gradient(circle at 40% 35%,${c},#101714 70%)`}"></span></div>`;return `<div class="bottle"><i class="neck"></i><i class="body" style="background:linear-gradient(135deg,${c},#17191b 82%)"></i><i class="label"></i></div>`}
function colLabel(i){let n=i+1,s='';while(n){n--;s=String.fromCharCode(65+n%26)+s;n=Math.floor(n/26)}return s}
function tabIcon(x){const p={Cave:'<path d="M3 20h18M5 20V7l7-4 7 4v13M8 10h3v3H8zm5 0h3v3h-3zM8 15h3v3H8zm5 0h3v3h-3z"/>',Bouteilles:'<path d="M10 2h4v4l2 3v11H8V9l2-3V2Z"/><path d="M8 12h8"/>','À boire':'<path d="M7 3h10l-1 7a4 4 0 0 1-8 0L7 3Z"/><path d="M12 14v7M8 21h8"/>',Stats:'<path d="M4 20V10h4v10m2 0V4h4v16m2 0v-7h4v7"/>',Alertes:'<path d="M12 3 2.8 19h18.4L12 3Z"/><path d="M12 9v4m0 3h.01"/>'};return `<svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true">${p[x]}</svg>`}
function tabs(){const arr=['Cave','Bouteilles','À boire','Stats','Alertes'];$('#tabs').innerHTML=arr.map(x=>`<button class="tab ${state.tab===x?'active':''}" onclick="setTab('${x}')">${tabIcon(x)}<span>${x}</span></button>`).join('')}
function setTab(t){state.tab=t;render()}function setFamily(f){state.family=f;render()}function setView(v){state.view=v;render()}function toast(t){$('#toast').innerHTML=`<div class="toast">${t}</div>`;setTimeout(()=>$('#toast').innerHTML='',2300)}
function resize(a,d){const n=[...state.dims[state.family]],count=bottles.filter(b=>b.family===state.family).length;n[a]=Math.max(1,Math.min(30,n[a]+d));if(n[0]*n[1]<count){toast('Impossible : les bouteilles doivent rester placées.');return}state.dims[state.family]=n;render()}
function render(){tabs();$('#fab').classList.toggle('show',state.tab==='Cave');if(state.tab==='Cave')renderCave();if(state.tab==='Bouteilles')renderList();if(state.tab==='À boire')renderPriorities();if(state.tab==='Stats')renderStats();if(state.tab==='Alertes')renderAlerts()}
function renderCave(){const priority=bottles.filter(b=>b.urgency>=75).length,peak=bottles.filter(b=>b.peak).length,safe=bottles.length-priority,vis=bottles.filter(b=>b.family===state.family),[cols,rows]=state.dims[state.family];let grid='<div></div>'+Array.from({length:cols},(_,c)=>`<div class="coord">${colLabel(c)}</div>`).join('');for(let r=0;r<rows;r++){grid+=`<div class="coord">${r+1}</div>`;for(let c=0;c<cols;c++){const w=vis[r*cols+c];grid+=w?`<button class="slot ${w.family==='Rouges'?'family-red':w.family==='Blancs'?'family-white':w.family==='Champagne'?'family-champagne':''}" onclick="openWine('${w.uid}','${colLabel(c)}${r+1}')">${icon(w,state.view)}<span class="urgency" style="background:${urgency(w)}"></span>${w.peak?'<span class="peak" title="À l’apogée"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.2 20.2H5.4c-1 0-1.8-.8-1.8-1.8v-7c0-1 .8-1.8 1.8-1.8h3.8v10.6Zm2-10.7 2.7-5.4c.3-.6 1-.9 1.6-.6.9.4 1.4 1.3 1.2 2.3l-.6 3.1h2.8c1.3 0 2.2 1.2 1.9 2.5l-1.5 6.8c-.2 1.1-1.2 1.9-2.3 1.9h-5.8V9.5Z"/></svg></span>':''}</button>`:`<div class="slot empty"></div>`}}$('#view').innerHTML=`<section class="card"><div class="eyebrow">ÉTAT DE LA CAVE</div><h1 class="headline">${priority>2?'La cave demande votre attention':priority?'Quelques bouteilles sont prêtes':'La cave est sereine'}</h1><div class="muted">${safe} bouteilles sans urgence, ${peak} à l’apogée et ${priority} prioritaires.</div><div class="families">${Object.keys(families).map(f=>`<button class="family ${state.family===f?'active':''}" onclick="setFamily('${f}')"><span class="dot" style="background:${families[f].color}"></span>${f}</button>`).join('')}</div></section><section class="rack"><div class="rack-head"><div><div class="rack-title">Rack ${state.family}</div><div class="muted">${vis.length}/${cols*rows} emplacements</div></div><span class="pill">${cols} × ${rows}</span></div><div class="rack-scroll"><div class="rack-grid" style="grid-template-columns:18px repeat(${cols},minmax(30px,1fr));min-width:${cols*38+18}px">${grid}</div></div><div class="controls"><div class="control-label">Affichage dans les racks uniquement</div><div class="segmented">${[['front','Bouteille'],['top','Vue bouchon'],['bottom','Vue dessous']].map(x=>`<button class="seg ${state.view===x[0]?'active':''}" onclick="setView('${x[0]}')">${x[1]}</button>`).join('')}</div><div class="sizes">${[[0,'Colonnes',cols],[1,'Rangées',rows]].map(x=>`<div class="sizebox"><button class="pm" onclick="resize(${x[0]},-1)" ${x[2]<=1?'disabled':''}>−</button><div class="sizeval">${x[1]}<br><b>${x[2]}</b></div><button class="pm" onclick="resize(${x[0]},1)">+</button></div>`).join('')}</div></div></section>`}
function renderList(){const list=wines.filter(w=>(w.domain+' '+w.name+' '+w.year).toLowerCase().includes(state.query.toLowerCase()));$('#view').innerHTML=`<input class="search" placeholder="Domaine, appellation, millésime…" value="${state.query}" oninput="state.query=this.value;renderList()"><div class="wine-list">${list.map(w=>`<button class="wine-card" onclick="openWine('${w.id}-0','')">${w.peak?'<span class="ribbon">APOGÉE</span>':''}<div class="wine-icon">${icon(w,'front')}</div><div><div class="muted">${w.family} · ${w.qty} bouteille(s)</div><div class="wine-name">${w.name}</div><div class="muted">${w.domain}</div><div style="margin-top:9px"><span class="year">${w.year}</span><span class="drink" style="color:${urgency(w)}">${w.drink}</span></div></div></button>`).join('')}</div>`}
function renderPriorities(){$('#view').innerHTML=`<h2>Priorités de consommation</h2>${[...wines].sort((a,b)=>b.urgency-a.urgency).map(w=>`<button class="priority" onclick="openWine('${w.id}-0','')"><b>${w.name} · ${w.year}</b><span style="float:right;font-size:11px;color:${urgency(w)}">${w.drink}</span><p>${w.evolution}</p></button>`).join('')}`}

function money(n){return new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR',maximumFractionDigits:0}).format(n)}
function valuationKey(){return state.valuation==='low'?'valueLow':state.valuation==='high'?'valueHigh':'valueMid'}
function setValuation(v){state.valuation=v;renderValue()}
function totals(){return ['Low','Mid','High'].reduce((o,k)=>(o[k.toLowerCase()]=wines.reduce((sum,w)=>sum+w.qty*w['value'+k],0),o),{})}
function renderStats(){
 const t=totals(),key=valuationKey(),total=t[state.valuation], byFamily=Object.keys(families).map(f=>({family:f,value:wines.filter(w=>w.family===f).reduce((sum,w)=>sum+w.qty*w[key],0)})).sort((a,b)=>b.value-a.value), max=Math.max(...byFamily.map(x=>x.value),1);
 const leaders=[...wines].sort((a,b)=>b[key]-a[key]).slice(0,5);
 const years=[2026,2027,2028,2029,2030], factors=[.96,1,1.035,1.07,1.11], maxTrend=total*1.11;
 const totalBottles=bottles.length, drinkNow=bottles.filter(w=>w.urgency>=75).length, watch=bottles.filter(w=>w.urgency>=45&&w.urgency<75).length, keep=bottles.filter(w=>w.urgency<45).length, peakCount=bottles.filter(w=>w.peak).length;
 const stageData=[['Jeunesse','#60a5fa'],['Évolution','#a78bfa'],['Maturité','#22c55e'],['Sénescence','#ef4444']].map(([name,color])=>({name,color,count:bottles.filter(w=>w.stage===name).length}));
 $('#view').innerHTML=`<section class="card"><div class="eyebrow">TABLEAU DE BORD</div><h1 class="headline">Statistiques</h1><div class="muted">Quantités, état de consommation et valorisation de la cave.</div><div class="stats-kpis"><button class="stats-kpi" style="--kpi-color:rgba(211,174,114,.24)" onclick="showStatsList('all','Toutes les bouteilles')"><small>Bouteilles en cave</small><strong>${totalBottles}</strong><span>${wines.length} références · toucher pour afficher</span></button><button class="stats-kpi" style="--kpi-color:rgba(239,68,68,.22)" onclick="showStatsList('drink','Bouteilles à boire')"><small>À boire</small><strong>${drinkNow}</strong><span>priorité actuelle · toucher pour afficher</span></button><button class="stats-kpi" style="--kpi-color:rgba(245,158,11,.2)" onclick="showStatsList('watch','Bouteilles à surveiller')"><small>À surveiller</small><strong>${watch}</strong><span>fenêtre approchante · toucher pour afficher</span></button><button class="stats-kpi" style="--kpi-color:rgba(96,165,250,.2)" onclick="showStatsList('keep','Bouteilles à garder')"><small>À garder</small><strong>${keep}</strong><span>peuvent patienter · toucher pour afficher</span></button></div></section><section class="card value-section"><h3>Stades de vieillissement</h3><div class="stage-grid">${stageData.map(x=>`<button class="stage-card" onclick="showStatsList('stage','Stade : ${x.name}','${x.name}')"><i style="background:${x.color}"></i><span><b>${x.count}</b><small>${x.name} · afficher</small></span></button>`).join('')}</div><div class="valuation-note">👍 ${peakCount} bouteille(s) actuellement repérée(s) à l’apogée.</div></section><section class="card value-section"><div class="eyebrow">ESTIMATION PATRIMONIALE</div><h2 style="margin:5px 0 4px">Valeur de la cave</h2><div class="muted">Estimation basse, moyenne ou haute selon la cotation retenue.</div><div class="value-summary">${[['low','Basse',t.low],['mid','Moyenne',t.mid],['high','Haute',t.high]].map(x=>`<button class="value-tile ${state.valuation===x[0]?'active':''}" onclick="setValuation('${x[0]}')"><small>${x[1]}</small><strong>${money(x[2])}</strong></button>`).join('')}</div><div class="valuation-note">Estimations de démonstration pour valider l’interface. Chaque fiche pourra ensuite conserver une valeur basse, moyenne et haute, ainsi que la date et la source de la dernière cotation.</div></section>
 <section class="card value-section"><h3>Répartition par famille</h3>${byFamily.map(x=>`<div class="bar-row"><div class="bar-label"><span class="dot" style="display:inline-block;margin:0 6px 0 0;background:${families[x.family].color}"></span>${x.family}</div><div class="bar-track"><div class="bar-fill" style="width:${x.value/max*100}%;background:${families[x.family].color}"></div></div><div class="bar-amount">${money(x.value)}</div></div>`).join('')}</section>
 <section class="card value-section"><h3>Projection indicative</h3><div class="muted">Simulation visuelle, sans cotation en ligne dans cette maquette.</div><div class="trend">${years.map((y,i)=>`<div class="trend-col"><div class="trend-bar" style="height:${Math.round(total*factors[i]/maxTrend*88)}px"></div><div class="trend-year">${y}</div></div>`).join('')}</div></section>
 <section class="card value-section"><h3>Bouteilles les mieux valorisées</h3>${leaders.map((w,i)=>`<button class="top-wine" style="width:100%;border:0;background:none;color:white;text-align:left" onclick="openWine('${w.id}-0','')"><span class="rank">${i+1}</span><span><span class="top-wine-name">${w.name} · ${w.year}</span><span class="top-wine-meta">${w.domain} · ${w.qty} bouteille(s)</span></span><span class="top-wine-value">${money(w[key])}/bt.</span></button>`).join('')}<div class="value-actions"><button class="value-action" onclick="toast('Export de la valorisation prévu dans la PWA')">⇩ Exporter</button><button class="value-action" onclick="toast('Mise à jour des cotations prévue par étapes')">↻ Actualiser</button></div></section>`
}
function renderAlerts(){const a=[['Jeunesse','#60a5fa','Le vin se construit encore. Il peut être aromatique mais trop ferme ou tannique.'],['Évolution','#a78bfa','Il s’assouplit et gagne en complexité.'],['Maturité','#22c55e','Il peut être prêt, à l’apogée ou encore patienter.'],['Sénescence','#ef4444','Le risque de déclin augmente.']];$('#view').innerHTML=a.map(x=>`<article class="alert-card"><div class="stage-dot" style="background:${x[1]}"></div><h3>${x[0]}</h3><div class="muted">${x[2]}</div></article>`).join('')}
let addMode='manual';
function openAddWine(mode='manual'){addMode=mode;renderAddWine()}
function renderAddWine(){const modeNames={manual:'Saisie manuelle',label:'Scanner l’étiquette',barcode:'Scanner le code-barres',online:'Recherche Internet'};$('#modal').innerHTML=`<div class="overlay" onclick="closeWine()"><aside class="sheet" onclick="event.stopPropagation()"><div class="sheet-head"><span class="muted">Ajouter un nouveau vin</span><button class="close" onclick="closeWine()">✕</button></div><div class="sheet-body"><div class="eyebrow">NOUVELLE ENTRÉE</div><h2 style="margin:5px 0">${modeNames[addMode]}</h2><div class="add-steps"><i class="add-step active"></i><i class="add-step active"></i><i class="add-step"></i></div><div class="add-methods">${[['manual','✎','Manuel','Tout renseigner'],['label','▣','Étiquette','Photo et OCR'],['barcode','▥','Code-barres','Lecture EAN'],['online','⌕','Internet','Nom, domaine, millésime']].map(x=>`<button class="add-method ${addMode===x[0]?'active':''}" onclick="openAddWine('${x[0]}')"><span class="method-icon">${x[1]}</span><b>${x[2]}</b><small>${x[3]}</small></button>`).join('')}</div>${addMode==='label'||addMode==='barcode'?`<div class="scan-zone"><div class="scan-frame"></div><b>${addMode==='label'?'Cadrez l’étiquette':'Cadrez le code-barres'}</b><div class="muted" style="margin:5px 0 12px">La caméra sera utilisée dans la PWA.</div><button class="secondary" onclick="simulateScan('${addMode}')">Simuler le scan</button></div>`:''}${addMode==='online'?`<div class="lookup"><input id="onlineQuery" class="search" placeholder="Ex. Château Gloria 2020"><button class="secondary" style="width:auto" onclick="simulateLookup()">Rechercher</button></div><div id="lookupResult"></div>`:''}<form id="addWineForm" onsubmit="saveWine(event)"><div class="form-grid"><div class="field"><label>Domaine</label><input id="addDomain" required placeholder="Domaine ou château"></div><div class="field"><label>Cuvée / vin</label><input id="addName" required placeholder="Nom de la cuvée"></div><div class="field"><label>Millésime</label><input id="addYear" type="number" min="1900" max="${new Date().getFullYear()}" value="2022" required></div><div class="field"><label>Quantité</label><input id="addQty" type="number" min="1" value="1" required></div><div class="field"><label>Famille</label><select id="addFamily"><option>Rouges</option><option>Blancs</option><option>Champagnes</option><option>Divers</option></select></div><div class="field"><label>Appellation</label><input id="addAppellation" placeholder="Appellation"></div><div class="field"><label>Cépages</label><input id="addGrapes" placeholder="Cépage ou assemblage"></div><div class="field"><label>Code-barres</label><input id="addBarcode" inputmode="numeric" placeholder="EAN"></div><div class="field"><label>Valeur basse (€)</label><input id="addValueLow" type="number" min="0" value="0"></div><div class="field"><label>Valeur moyenne (€)</label><input id="addValueMid" type="number" min="0" value="0"></div><div class="field"><label>Valeur haute (€)</label><input id="addValueHigh" type="number" min="0" value="0"></div><div class="field"><label>Stade initial</label><select id="addStage"><option>Jeunesse</option><option>Évolution</option><option>Maturité</option><option>Sénescence</option></select></div><div class="field full"><label>Notes et informations complémentaires</label><textarea id="addNotes" placeholder="Terroir, garde, service, accords, notes personnelles…"></textarea></div></div><button class="primary" type="submit">Ajouter et placer automatiquement</button></form></div></aside></div>`}
function setAddFields(d){Object.entries(d).forEach(([k,v])=>{const e=$('#add'+k);if(e)e.value=v})}
function simulateScan(type){if(type==='label')setAddFields({Domain:'Château Gloria',Name:'Saint-Julien',Year:2020,Family:'Rouges',Appellation:'Saint-Julien',Grapes:'Cabernet Sauvignon, Merlot'});else setAddFields({Barcode:'3760123456789',Domain:'Domaine exemple',Name:'Cuvée Réserve',Year:2021,Family:'Rouges'});toast('Informations détectées : vérifie puis complète la fiche.')}
function simulateLookup(){const q=$('#onlineQuery').value.trim();if(!q){toast('Saisis un nom, un domaine ou un millésime.');return}setAddFields({Domain:'Château Gloria',Name:'Saint-Julien',Year:2020,Family:'Rouges',Appellation:'Saint-Julien',Grapes:'Cabernet Sauvignon, Merlot',ValueLow:38,ValueMid:45,ValueHigh:55});$('#lookupResult').innerHTML='<div class="lookup-result">Résultat trouvé et fiche préremplie. Les données Internet devront toujours être validées avant l’enregistrement.</div>'}
function saveWine(e){e.preventDefault();const id=Math.max(...wines.map(w=>w.id))+1,qty=Math.max(1,+$('#addQty').value||1),family=$('#addFamily').value,stage=$('#addStage').value;const urg={Jeunesse:25,'Évolution':50,Maturité:78,'Sénescence':95}[stage];const w={id,qty,family,domain:$('#addDomain').value,name:$('#addName').value,year:+$('#addYear').value,stage,drink:urg>=75?'À boire':'À garder',urgency:urg,peak:stage==='Maturité',appellation:$('#addAppellation').value||'À compléter',grapes:$('#addGrapes').value||'À compléter',valueLow:+$('#addValueLow').value||0,valueMid:+$('#addValueMid').value||0,valueHigh:+$('#addValueHigh').value||0,story:$('#addNotes').value||'Informations à compléter.',terroir:'À compléter.',vintage:'À compléter.',palate:'À compléter.',evolution:'À compléter.',aging:'À compléter.',window:'À définir',serving:'À définir',pairing:'À compléter.'};wines.push(w);for(let i=0;i<qty;i++)bottles.push({...w,uid:id+'-'+i});state.family=family;closeWine();render();toast(`${qty} bouteille(s) ajoutée(s) et placée(s) automatiquement.`)}
function showStatsList(type,title,stage=''){
 let list=bottles;
 if(type==='drink')list=bottles.filter(w=>w.urgency>=75);
 if(type==='watch')list=bottles.filter(w=>w.urgency>=45&&w.urgency<75);
 if(type==='keep')list=bottles.filter(w=>w.urgency<45);
 if(type==='stage')list=bottles.filter(w=>w.stage===stage);
 $('#modal').innerHTML=`<div class="overlay" onclick="closeWine()"><aside class="sheet" onclick="event.stopPropagation()"><div class="sheet-head"><span class="muted">Statistiques détaillées</span><button class="close" onclick="closeWine()">✕</button></div><div class="sheet-body"><div class="stat-list-head"><div><div class="eyebrow">SÉLECTION</div><h2 style="margin:5px 0">${title}</h2><div class="muted">${list.length} bouteille(s) concernée(s)</div></div></div><div class="stat-list">${list.length?list.map(w=>`<button class="stat-wine" onclick="openWine('${w.uid}','')"><span class="stat-wine-icon">${icon(w,'front')}</span><span><span class="stat-wine-name">${w.name}</span><span class="stat-wine-meta">${w.domain} · ${w.year} · ${w.family}</span></span><span class="stat-wine-status" style="color:${urgency(w)}">${w.stage}</span></button>`).join(''):'<div class="valuation-note">Aucune bouteille dans cette catégorie.</div>'}</div></div></aside></div>`
}
function openWine(uid,slot){const w=bottles.find(b=>b.uid===uid)||wines.find(b=>String(b.id)===uid.split('-')[0]);if(!w)return;$('#modal').innerHTML=`<div class="overlay" onclick="closeWine()"><aside class="sheet" onclick="event.stopPropagation()"><div class="sheet-head"><span class="muted">Fiche détaillée</span><button class="close" onclick="closeWine()">✕</button></div><div class="sheet-body"><div class="hero"><div class="photo">${icon(w,'front')}<button class="photo-btn" onclick="toast('Ajout de photo disponible dans la future APK')">📷 Ma photo</button>${w.peak?'<span class="ribbon">APOGÉE</span>':''}</div><div><div class="eyebrow">${w.family} · ${w.appellation}</div><h2>${w.name}</h2><div class="hero-meta"><p class="hero-domain">${w.domain}</p><span class="hero-year">${w.year}</span></div><div class="badges"><span class="badge">${w.stage}</span><span class="badge" style="color:${urgency(w)}">${w.drink}</span></div></div></div><div class="info-grid"><div class="info"><h4>Emplacement</h4><p>${slot||'Placement automatique'}</p></div><div class="info"><h4>Fenêtre</h4><p>${w.window}</p></div></div><div class="info-stack">${[['Histoire du domaine et identité',w.story],['Cépages et assemblage',w.grapes],['Terroir et exposition',w.terroir],['Lecture du millésime '+w.year,w.vintage],['Profil en bouche',w.palate],['Évolution actuelle et future',w.evolution],['Potentiel de garde',w.aging],['Service',w.serving],['Accords suggérés',w.pairing]].map(x=>`<div class="info"><h4>${x[0]}</h4><p>${x[1]}</p></div>`).join('')}</div></div></aside></div>`}
function closeWine(){$('#modal').innerHTML=''}
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
render();
</script>
</body></html>
