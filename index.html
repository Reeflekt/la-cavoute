 $('#view').innerHTML=`<section class="card"><div class="eyebrow">VUE D’ENSEMBLE</div><h1 class="headline">Dashboard</h1><div class="muted">Quantités, état de consommation et valorisation de la cave.</div>${backupReminder()}<div class="stats-kpis"><button class="stats-kpi" style="--kpi-color:rgba(211,174,114,.24)" onclick="showStatsList('all','Toutes les bouteilles')"><small>Bouteilles en cave</small><strong>${totalBottles}</strong><span>${activeWines().length} références · toucher pour afficher</span></button><button class="stats-kpi" style="--kpi-color:rgba(239,68,68,.22)" onclick="showStatsList('drink','Bouteilles à boire')"><small>À boire</small><strong>${drinkNow}</strong><span>priorité actuelle · toucher pour afficher</span></button><button class="stats-kpi" style="--kpi-color:rgba(245,158,11,.2)" onclick="showStatsList('watch','Bouteilles à surveiller')"><small>À surveiller</small><strong>${watch}</strong><span>fenêtre approchante · toucher pour afficher</span></button><button class="stats-kpi" style="--kpi-color:rgba(96,165,250,.2)" onclick="showStatsList('keep','Bouteilles à garder')"><small>À garder</small><strong>${keep}</strong><span>peuvent patienter · toucher pour afficher</span></button></div></section><section class="card value-section"><h3>Stades de vieillissement</h3><div class="stage-grid">${stageData.map(x=>`<button class="stage-card" onclick="showStatsList('stage','Stade : ${x.name}','${x.name}')"><i style="background:${x.color}"></i><span><b>${x.count}</b><small>${x.name} · afficher</small></span></button>`).join('')}</div><div class="valuation-note">👍 ${peakCount} bouteille(s) actuellement repérée(s) à l’apogée.</div></section><section class="card value-section"><button class="value-toggle" onclick="toggleValue()" aria-expanded="${open}"><span><span class="eyebrow">ESTIMATION PATRIMONIALE</span><span class="value-title">Valeur de la cave</span></span><span class="value-chevron${open?' open':''}" aria-hidden="true">▾</span></button>${open?`<div function validateBackup(o){const errors=[],warnings=[];if(!o||typeof o!=='object'||Array.isArray(o))return{ok:false,errors:['Le fichier n’est pas une sauvegarde La Cavoute.']};if(o.app!=='La Cavoute')errors.push('Ce fichier n’a pas été créé par La Cavoute.');if(!Number.isInteger(o.schema)||o.schema<1)errors.push('Version du format absente ou invalide.');else if(o.schema>DATA_SCHEMA)errors.push('Ce fichier vient d’une version plus récente de l’application (format '+o.schema+').');if(!Array.isArray(o.wines))errors.push('La liste des vins est absente.');if(errors.length)return{ok:false,errors};const w=normalizeWines(o.wines);if(w.dropped)warnings.push(w.dropped+' vin(s) invalide(s) ou en double ignoré(s).');let rk=sanitizeRacks(o.racks);if(!rk.length){rk=structuredClone(DEFAULT_RACKS);if(o.racks!==undefined)warnings.push('Racks absents ou invalides : racks par défaut utilisés.')}const valid=new Set();w.list.forEach(x=>{for(let i=0;i<x.qty;i++)valid.add(x.id+'-'+i)});const pos={};if(o.positions&&typeof o.positions==='object'&&!Array.isArray(o.positions))Object.entries(o.positions).forEach(([u,p])=>{if(valid.has(u)&&p&&typeof p.rackId==='string'&&Number.isInteger(p.col)&&Number.isInteger(p.row))pos[u]={rackId:p.rackId,col:p.col,row:p.row}});const hist=[];(Array.isArray(o.history)?o.history:[]).forEach(h=>{if(h&&typeof h==='object'&&typeof h.uid==='string'&&/^\d+-\d+$/.test(h.uid)&&['Bue','Retirée'].includes(h.action))hist.push({uid:h.uid,id:parseInt(h.uid,10),name:cleanTxt(h.name,'',200),domain:cleanTxt(h.domain,'',200),year:Math.round(cleanNum(h.year,0,0,3000))||'',family:Object.prototype.hasOwnProperty.call(families,h.family)?h.family:'',action:h.action,date:isNaN(Date.parse(h.date))?new Date().toISOString():new Date(h.date).toISOString(),slot:cleanTxt(h.slot,'',80)})});const pf=o.prefs&&typeof o.prefs==='object'?{view:['front','top','bottom'].includes(o.prefs.view)?o.prefs.view:'front',valuation:['low','mid','high'].includes(o.prefs.valuation)?o.prefs.valuation:'mid'}:null;return{ok:true,warnings,data:{wines:w.list,racks:rk,positions:pos,history:hist,prefs:pf},stats:{wines:w.list.length,bottles:w.list.reduce((t,x)=>t+x.qty,0),racks:rk.length,positions:Object.keys(pos).length,history:hist.length,exportedAt:o.exportedAt}}}

function showImportResult(name,v){const body=v.ok?`<div class="info-stack"><div class="info"><h4>Contenu du fichier</h4><p>${v.stats.wines} vin(s) · ${v.stats.bottles} bouteille(s) · ${v.stats.racks} rack(s) · ${v.stats.history} sortie(s) d’historique${v.stats.exportedAt&&fmtDate(v.stats.exportedAt)?'<br>Sauvegarde du '+esc(fmtDate(v.stats.exportedAt)):''}</p></div>${v.warnings.length?`<div class="info"><h4>À noter</h4><p>${v.warnings.map(esc).join('<br>')}</p></div>`:''}<div class="info"><h4>Attention</h4><p>Vos données actuelles seront remplacées. Une copie de sécurité est conservée pour pouvoir annuler l’import.</p></div></div><div class="consume-actions"><button class="consume-btn" onclick="applyImport()">Remplacer mes données</button><button class="secondary" onclick="closeWine()">Annuler</button></div>`:`<div class="info-stack"><div class="info"><h4>Import impossible</h4><p>${v.errors.map(esc).join('<br>')}</p></div></div><div class="consume-actions"><button class="secondary" onclick="closeWine()">Fermer</button></div>`;$('#modal').innerHTML=`<div class="overlay" onclick="closeWine()"><aside class="sheet" onclick="event.stopPropagation()"><div class="sheet-head"><span class="muted">Import de sauvegarde</span><button class="close" onclick="closeWine()">✕</button></div><div class="sheet-body"><div class="eyebrow">FICHIER</div><h2 style="margin:5px 0">${esc(name)}</h2>${body}</div></aside></div>`}
function dataKeys(){return[WINES_KEY,RACKS_KEY,POSITIONS_KEY,BOTTLE_HISTORY_KEY,PREFS_KEY,META_KEY]}
function applyBackup(data){const prev={};dataKeys().forEach(k=>{try{prev[k]=localStorage.getItem(k)}catch(e){prev[k]=null}});if(!store(PREIMPORT_KEY,JSON.stringify({savedAt:new Date().toISOString(),data:buildBackup()}))){toast('Import annulé : copie de sécurité impossible (espace insuffisant).',5000);return false}const writes=[[WINES_KEY,JSON.stringify(data.wines)],[RACKS_KEY,JSON.stringify(data.racks)],[POSITIONS_KEY,JSON.stringify(data.positions)],[BOTTLE_HISTORY_KEY,JSON.stringify(data.history)],[META_KEY,JSON.stringify({...meta,schema:DATA_SCHEMA})]];if(data.prefs)writes.push([PREFS_KEY,JSON.stringify(data.prefs)]);let ok=true;for(const [k,v] of writes){if(!store(k,v)){ok=false;break}}if(!ok){dataKeys().forEach(k=>{try{if(prev[k]===null)localStorage.removeItem(k);else localStorage.setItem(k,prev[k])}catch(e){}});toast('Import annulé : écriture impossible. Vos données précédentes sont conservées.',5000);return false}return true}

function renderAddWine(){const modeNames={manual:'Saisie manuelle',label:'Scanner l’étiquette',barcode:'Scanner le code-barres',online:'Recherche Internet'};$('#modal').innerHTML=`<div class="overlay" onclick="closeWine()"><aside class="sheet" onclick="event.stopPropagation()"><div class="sheet-head"><span class="muted">Ajouter un nouveau vin</span><button class="close" onclick="closeWine()">✕</button></div><div class="sheet-body"><div class="eyebrow">NOUVELLE ENTRÉE</div><h2 style="margin:5px 0">${modeNames[addMode]}</h2><div class="add-steps"><i class="add-step active"></i><i class="add-step active"></i><i class="add-step"></i></div><div class="add-methods">${[['manual','✎','Manuel','Tout renseigner'],['label','▣','Étiquette','Photo et OCR'],['barcode','▥','Code-barres','Lecture EAN'],['online','⌕','Internet','Nom, domaine, millésime']].map(x=>`<button class="add-method ${addMode===x[0]?'active':''}" onclick="openAddWine('${x[0]}')"><span class="method-icon">${x[1]}</span><b>${x[2]}</b><small>${x[3]}</small></button>`).join('')}</div>${addMode==='label'||addMode==='barcode'?`<div class="scan-zone"><div class="scan-frame"></div><b>${addMode==='label'?'Cadrez l’étiquette':'Cadrez le code-barres'}</b><div class="muted" style="margin:5px 0 12px">La caméra sera utilisée dans la PWA.</div><button class="secondary" onclick="simulateScan('${addMode}')">Simuler le scan</button></div>`:''}${addMode==='online'?`<div class="lookup"><input id="onlineQuery" class="search" placeholder="Ex. Château Gloria 2020"><button class="secondary" style="width:auto" onclick="simulateLookup()">Rechercher</button></div><div id="lookupResult"></div>`:''}<form id="addWineForm" onsubmit="saveWine(event)"><div class="form-grid"><div class="field"><label>Domaine</label><input id="addDomain" required placeholder="Domaine ou château"></div><div class="field"><label>Cuvée / vin</label><input id="addName" required placeholder="Nom de la cuvée"></div><div class="field"><label>Millésime</label><input id="addYear" type="number" min="1900" max="${new Date().getFullYear()}" value="2022" required></div><div class="field"><label>Quantité</label><input id="addQty" type="number" min="1" value="1" required></div><div class="field"><label>Famille</label><select id="addFamily"><option>Rouges</option><option>Blancs</option><option>Champagnes</option><option>Divers</option></select></div><div class="field"><label>Appellation</label><input id="addAppellation" placeholder="Appellation"></div><div class="field"><label>Cépages</label><input id="addGrapes" placeholder="Cépage ou assemblage"></div><div class="field"><label>Code-barres</label><input id="addBarcode" inputmode="numeric" placeholder="EAN"></div><div class="field"><label>Valeur basse (€)</label><input id="addValueLow" type="number" min="0" value="0"></div><div class="field"><label>Valeur moyenne (€)</label><input id="addValueMid" type="number" min="0" value="0"></div><div class="field"><label>Valeur haute (€)</label><input id="addValueHigh" type="number" min="0" value="0"></div><div class="field"><label>Stade initial</label><select id="addStage"><option>Jeunesse</option><option>Évolution</option><option>Maturité</option><option>Sénescence</option></select></div><div class="field full"><label>Notes et informations complémentaires</label><textarea id="addNotes" placeholder="Terroir, garde, service, accords, notes personnelles…"></textarea></div></div><button class="primary" type="submit">Ajouter et placer automatiquement</button></form></div></aside></div>`}
function setAddFields(d){Object.entries(d).forEach(([k,v])=>{const e=$('#add'+k);if(e)e.value=v})}
function simulateScan(type){if(type==='label')setAddFields({Domain:'Château Gloria',Name:'Saint-Julien',Year:2020,Family:'Rouges',Appellation:'Saint-Julien',Grapes:'Cabernet Sauvignon, Merlot'});else setAddFields({Barcode:'3760123456789',Domain:'Domaine exemple',Name:'Cuvée Réserve',Year:2021,Family:'Rouges'});toast('Informations détectées : vérifie puis complète la fiche.')}
function simulateLookup(){const q=$('#onlineQuery').value.trim();if(!q){toast('Saisis un nom, un domaine ou un millésime.');return}setAddFields({Domain:'Château Gloria',Name:'Saint-Julien',Year:2020,Family:'Rouges',Appellation:'Saint-Julien',Grapes:'Cabernet Sauvignon, Merlot',ValueLow:38,ValueMid:45,ValueHigh:55});$('#lookupResult').innerHTML='<div class="lookup-result">Résultat trouvé et fiche préremplie. Les données Internet devront toujours être validées avant l’enregistrement.</div>'}
function saveWine(e){e.preventDefault();const id=nextWineId(),qty=Math.max(1,Math.min(999,Math.round(+$('#addQty').value)||1)),family=$('#addFamily').value,stage=$('#addStage').value;const urg={Jeunesse:25,'Évolution':50,Maturité:78,'Sénescence':95}[stage];const w={id,qty,family,domain:$('#addDomain').value.trim(),name:$('#addName').value.trim(),year:+$('#addYear').value,stage,drink:urg>=75?'À boire':'À garder',urgency:urg,peak:stage==='Maturité',appellation:$('#addAppellation').value||'À compléter',grapes:$('#addGrapes').value||'À compléter',valueLow:+$('#addValueLow').value||0,valueMid:+$('#addValueMid').value||0,valueHigh:+$('#addValueHigh').value||0,story:$('#addNotes').value||'Informations à compléter.',terroir:'À compléter.',vintage:'À compléter.',palate:'À compléter.',evolution:'À compléter.',aging:'À compléter.',window:'À définir',serving:'À définir',pairing:'À compléter.'};wines.push(w);for(let i=0;i<qty;i++)bottles.push({...w,uid:id+'-'+i});saveWines();ensurePositions();state.family=family;closeWine();render();const missing=activeBottles().filter(b=>b.id===id&&!bottlePositions[b.uid]).length;toast(missing?`${qty} bouteille(s) ajoutée(s), dont ${missing} sans emplacement : agrandissez un rack ou créez-en un.`:`${qty} bouteille(s) ajoutée(s) et placée(s) automatiquement.`,missing?4500:2300)}
function showStatsList(type,title,stage=''){
 let list=activeBottles();
 if(type==='drink')list=activeBottles().filter(w=>w.urgency>=75);
 if(type==='watch')list=activeBottles().filter(w=>w.urgency>=45&&w.urgency<75);
 if(type==='keep')list=activeBottles().filter(w=>w.urgency<45);
 if(type==='stage')list=activeBottles().filter(w=>w.stage===stage);
 $('#modal').innerHTML=`<div class="overlay" onclick="closeWine()"><aside class="sheet" onclick="event.stopPropagation()"><div class="sheet-head"><span class="muted">Statistiques détaillées</span><button class="close" onclick="closeWine()">✕</button></div><div class="sheet-body"><div class="stat-list-head"><div><div class="eyebrow">SÉLECTION</div><h2 style="margin:5px 0">${title}</h2><div class="muted">${list.length} bouteille(s) concernée(s)</div></div></div><div class="stat-list">${list.length?list.map(w=>`<button class="stat-wine" onclick="openWine('${w.uid}')"><span class="stat-wine-icon">${icon(w,'front')}</span><span><span class="stat-wine-name">${esc(w.name)}</span><span class="stat-wine-domain">${esc(w.domain)}</span><span class="stat-wine-meta">${esc(w.year)} · ${w.family}</span></span><span class="stat-wine-status" style="color:${urgency(w)}">${w.stage}</span></button>`).join(''):'<div class="valuation-note">Aucune bouteille dans cette catégorie.</div>'}</div></div></aside></div>`
}
function removeBottleFromCellar(uid,action){const b=activeBottles().find(x=>x.uid===uid);if(!b)return;const slot=slotLabel(b.uid);const label=action==='Bue'?'Confirmer que cette bouteille a été bue ?':'Confirmer le retrait de cette bouteille sans la marquer comme bue ?';if(!confirm(label))return;bottleHistory.push({uid:b.uid,id:b.id,name:b.name,domain:b.domain,year:b.year,family:b.family,action,date:new Date().toISOString(),slot:slot||''});saveBottleHistory();delete bottlePositions[b.uid];savePositions();closeWine();render();toast(action==='Bue'?'Bouteille bue : la case est libérée.':'Bouteille retirée : la case est libérée.')}
function openWine(uid){const w=activeBottles().find(b=>b.uid===uid)||activeWines().find(b=>String(b.id)===uid.split('-')[0]);if(!w)return;const slot=slotLabel(w.uid);$('#modal').innerHTML=`<div class="overlay" onclick="closeWine()"><aside class="sheet" onclick="event.stopPropagation()"><div class="sheet-head"><span class="muted">Fiche détaillée</span><button class="close" onclick="closeWine()">✕</button></div><div class="sheet-body"><div class="hero"><div class="photo">${icon(w,'front')}<button class="photo-btn" onclick="toast('Ajout de photo disponible dans la future APK')">📷 Ma photo</button>${w.peak?'<span class="ribbon">APOGÉE</span>':''}</div><div><div class="eyebrow">${w.family} · ${esc(w.appellation)}</div><h2>${esc(w.name)}</h2><div class="hero-meta"><p class="hero-domain">${esc(w.domain)}</p><span class="hero-year">${esc(w.year)}</span></div><div class="badges"><span class="badge">${w.stage}</span><span class="badge" style="color:${urgency(w)}">${w.drink}</span></div></div></div><div class="info-grid"><div class="info"><h4>Emplacement</h4><p>${esc(slot)||'Non placée'}</p></div><div class="info"><h4>Fenêtre</h4><p>${esc(w.window)}</p></div></div><div class="info-stack">${[['Histoire du domaine et identité',w.story],['Cépages et assemblage',w.grapes],['Terroir et exposition',w.terroir],['Lecture du millésime '+w.year,w.vintage],['Profil en bouche',w.palate],['Évolution actuelle et future',w.evolution],['Potentiel de garde',w.aging],['Service',w.serving],['Accords suggérés',w.pairing]].map(x=>`<div class="info"><h4>${esc(x[0])}</h4><p>${esc(x[1])}</p></div>`).join('')}</div><div class="consume-actions"><button class="consume-btn" onclick="removeBottleFromCellar('${w.uid}','Bue')">✓ J’ai bu cette bouteille</button><button class="remove-btn" onclick="removeBottleFromCellar('${w.uid}','Retirée')">Retirer sans la marquer comme bue</button></div></div></aside></div>`}
function closeWine(){$('#modal').innerHTML=''}
if('serviceWorker' in navigator){const hadController=!!navigator.serviceWorker.controller;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(hadController)toast('Nouvelle version installée : fermez puis rouvrez l’application pour l’utiliser.',6000)});window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}))}
ensurePositions();
document.addEventListener('visibilitychange',()=>{if(document.hidden&&state.valueOpen){state.valueOpen=false;if(state.tab==='Dashboard')renderDashboard()}});
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{})}catch(e){}
render();
</script>
</body></html>
